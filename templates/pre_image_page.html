<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pre Image Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-color: white;
            font-family: Helvetica;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 20px;
        }
        .grid-container .grid-item:nth-child(4),
        .grid-container .grid-item:nth-child(5) {
            grid-column: span 1;
        }
        .grid-item {
            width: 100%;
            height: auto;
            cursor: pointer;
        }
        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .button-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
        }
        .navigate-button {
            border: 2px solid black;
            margin-top: 20px;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .navigate-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div style="position: absolute; top: 0; left: 0; padding: 10px;">
        <span style="font-size: 2em;">AI4VS LAB</span>
    </div>
    <!-- Main Container -->
    <div class="container">
        <!-- Image Grid -->
        <div class="grid-container">
            <div class="grid-item" onclick="navigateToImage(1)"><img src="{{ image_urls[0] }}" alt="Patient image 1"></div>
            <div class="grid-item" onclick="navigateToImage(2)"><img src="{{ image_urls[1] }}" alt="Patient image 2"></div>
            <div class="grid-item" onclick="navigateToImage(3)"><img src="{{ image_urls[2] }}" alt="Patient image 3"></div>
            <div class="grid-item" onclick="navigateToImage(4)"><img src="{{ image_urls[3] }}" alt="Patient image 4"></div>
            <div class="grid-item" onclick="navigateToImage(5)"><img src="{{ image_urls[4] }}" alt="Patient image 5"></div>
        </div>
    </div>

    <script>
        var patient_id = '{{ patient_id | safe }}';

        function navigateToImage(imageNumber) {
            try {
                var url = 'http://localhost:5500/image/exp' + encodeURIComponent(patient_id) + '_' + imageNumber;
                window.location.href = url;
            } catch (error) {
                console.error('Error navigating to image:', error);
            }
        }


        function requestFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.mozRequestFullScreen) { // Firefox
                elem.mozRequestFullScreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.webkitRequestFullscreen) { // Chrome, Safari and Opera
                elem.webkitRequestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            }
        }

        // Check if the document is in fullscreen mode and request it if not
        document.addEventListener('DOMContentLoaded', (event) => {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                requestFullScreen();
            }
        });
    </script>
</body>
</html>

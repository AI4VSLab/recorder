<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fullscreen Request</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            color: white;
            font-family: Helvetica;
            font-size: 24px;
        }
        .button {
            padding: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-size: 20px;
        }
        .button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div>
        <p>Click the button to enter fullscreen mode</p>
        <button class="button" onclick="requestFullScreen()">Go Fullscreen</button>
    </div>
    <script>
        function requestFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().then(() => {
                    window.location.href = 'main.html'; // Redirect to the main content page
                }).catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.mozRequestFullScreen) { // Firefox
                elem.mozRequestFullScreen().then(() => {
                    window.location.href = 'main.html'; // Redirect to the main content page
                }).catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.webkitRequestFullscreen) { // Chrome, Safari and Opera
                elem.webkitRequestFullscreen().then(() => {
                    window.location.href = 'main.html'; // Redirect to the main content page
                }).catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else if (elem.msRequestFullscreen) { // IE/Edge
                elem.msRequestFullscreen().then(() => {
                    window.location.href = 'main.html'; // Redirect to the main content page
                }).catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            }
        }
    </script>
</body>
</html>

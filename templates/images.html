<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI4VS LAB — Diagnosis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 980px;
      padding: 32px;
      border: 1px solid #2f2f2f;
      border-radius: 18px;
      background: #202020;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .response-section {
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    .input-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-panel label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaa;
    }

    .input-panel .hint {
      font-size: 0.75rem;
      color: #666;
      margin-top: -4px;
    }

    .other-input {
      width: 100%;
      border: 1.5px solid #444;
      border-radius: 10px;
      background: #2a2a2a;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #eee;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      font-family: Helvetica, Arial, sans-serif;
    }
    .other-input::placeholder { color: #555; }
    .other-input:focus {
      border-color: #777;
      background: #333;
    }

    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border: 1px solid #353535;
      border-radius: 12px;
      background: #1d1d1d;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #dfdfdf;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4caf50;
      flex-shrink: 0;
    }

    .other-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 6px;
      border-top: 1px solid #2f2f2f;
    }

    .autosave-note {
      width: 100%;
      text-align: center;
      color: #8e8e8e;
      font-size: 0.88rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 720px) {
      main {
        padding: 24px;
      }

      .response-section {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="response-section">
      <div class="input-panel">
        <label for="biomarkers">Biomarkers / Features</label>
        <span class="hint">Select all that apply</span>
        <div class="checkbox-list" id="biomarkers">
          {% for option in biomarker_options %}
          <label class="checkbox-item">
            <input
              type="checkbox"
              name="biomarkers"
              value="{{ option }}"
              {% if option == "Other" %}data-other-toggle="biomarkerOtherRow"{% endif %}
            />
            <span>{{ option }}</span>
          </label>
          {% endfor %}
          <div class="other-row hidden" id="biomarkerOtherRow">
            <input
              type="text"
              id="biomarkerOther"
              class="other-input"
              placeholder="Other biomarker / feature"
            />
          </div>
        </div>
      </div>

      <div class="input-panel">
        <label for="diagnosis">Diagnosis</label>
        <span class="hint">Select all that apply</span>
        <div class="checkbox-list" id="diagnosis">
          {% for option in diagnosis_options %}
          <label class="checkbox-item">
            <input
              type="checkbox"
              name="diagnoses"
              value="{{ option }}"
              {% if option == "Other" %}data-other-toggle="diagnosisOtherRow"{% endif %}
            />
            <span>{{ option }}</span>
          </label>
          {% endfor %}
          <div class="other-row hidden" id="diagnosisOtherRow">
            <input
              type="text"
              id="diagnosisOther"
              class="other-input"
              placeholder="Other diagnosis"
            />
          </div>
        </div>
      </div>
    </div>

    <p class="autosave-note">Selections are saved automatically when this page closes.</p>
  </main>

  <script>
    let autosaved = false;

    function selectedValues(name) {
      return Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(el => el.value);
    }

    function buildPayload() {
      return {
        biomarkers: selectedValues('biomarkers'),
        diagnoses: selectedValues('diagnoses'),
        biomarker_other: document.getElementById('biomarkerOther').value.trim(),
        diagnosis_other: document.getElementById('diagnosisOther').value.trim(),
      };
    }

    function sendAutosave() {
      if (autosaved) return;
      autosaved = true;

      const payload = buildPayload();
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      if (!navigator.sendBeacon('/autosave', blob)) {
        fetch('/autosave', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true,
        }).catch(() => {});
      }
    }

    document.querySelectorAll('[data-other-toggle]').forEach((checkbox) => {
      const target = document.getElementById(checkbox.dataset.otherToggle);
      checkbox.addEventListener('change', () => {
        target.classList.toggle('hidden', !checkbox.checked);
      });
    });

    document.querySelectorAll('input').forEach((input) => {
      input.addEventListener('change', () => {
        autosaved = false;
      });
      input.addEventListener('input', () => {
        autosaved = false;
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'F10') {
        e.preventDefault();
        sendAutosave();
      }
    });

    window.addEventListener('pagehide', sendAutosave);
    window.addEventListener('beforeunload', sendAutosave);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI4VS LAB — Diagnosis</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #1a1a1a;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 760px;
      padding: 32px;
      border: 1px solid #2f2f2f;
      border-radius: 18px;
      background: #202020;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .response-section {
      width: 100%;
      display: flex;
      flex-direction: row;
      gap: 16px;
      align-items: flex-start;
    }

    .input-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-panel label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #aaa;
    }

    .input-panel .hint {
      font-size: 0.75rem;
      color: #666;
      margin-top: -4px;
    }

    .input-panel textarea,
    .input-panel input[type="text"] {
      width: 100%;
      border: 1.5px solid #444;
      border-radius: 10px;
      background: #2a2a2a;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #eee;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      font-family: Helvetica, Arial, sans-serif;
    }
    .input-panel textarea::placeholder,
    .input-panel input[type="text"]::placeholder { color: #555; }
    .input-panel textarea:focus,
    .input-panel input[type="text"]:focus {
      border-color: #777;
      background: #333;
    }

    /* Biomarker box is taller since it's a list */
    #biomarkers {
      height: 140px;
      resize: none;
    }

    /* Diagnosis is a single-line text input */
    #diagnosis {
      height: 44px;
    }

    .panel-divider {
      width: 1px;
      background: #333;
      align-self: stretch;
      margin: 28px 0 0;
    }

    .btn-area {
      width: 100%;
      display: flex;
      align-items: center;
    }

    button.submit-btn {
      padding: 10px 32px;
      font-size: 1rem;
      border-radius: 8px;
      border: 2px solid #4caf50;
      background: #4caf50;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    button.submit-btn:hover  { background: #43a047; border-color: #43a047; }
    button.submit-btn:active { transform: scale(0.98); }
    button.submit-btn:disabled {
      background: #2a2a2a;
      color: #555;
      border-color: #444;
      cursor: not-allowed;
    }
    button.submit-btn.error {
      background: #2a2a2a;
      color: #e53935;
      border-color: #e53935;
      cursor: default;
    }

    @media (max-width: 720px) {
      main {
        padding: 24px;
      }

      .response-section {
        flex-direction: column;
      }

      .panel-divider {
        width: 100%;
        height: 1px;
        margin: 4px 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="response-section">
      <div class="input-panel">
        <label for="biomarkers">Biomarkers / Features</label>
        <span class="hint">Comma-separated list</span>
        <textarea id="biomarkers" placeholder="e.g. cup-to-disc ratio, RNFL thinning, notching…"></textarea>
      </div>

      <div class="panel-divider"></div>

      <div class="input-panel">
        <label for="diagnosis">Diagnosis</label>
        <span class="hint">Single label</span>
        <input type="text" id="diagnosis" placeholder="e.g. Glaucoma" />
      </div>
    </div>

    <div class="btn-area">
      <button class="submit-btn" id="submitBtn">Save and close</button>
    </div>
  </main>

  <script>
    let submitted = false;

    const submitBtn = document.getElementById('submitBtn');
    const biomarkersEl = document.getElementById('biomarkers');
    const diagnosisEl = document.getElementById('diagnosis');

    function closePage() {
      window.open('', '_self');
      window.close();

      setTimeout(() => {
        document.body.innerHTML = '';
      }, 150);
    }

    async function doSubmit() {
      if (submitted) return;
      submitted = true;
      submitBtn.disabled = true;

      const payload = {
        diagnosis: diagnosisEl.value.trim(),
        biomarkers: biomarkersEl.value.trim(),
      };

      try {
        const response = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await response.json();

        if (data.status === 'ok') {
          closePage();
          return;
        }

        throw new Error('Unexpected server response');
      } catch (err) {
        console.error('[AI4VS] Submit error:', err);
        submitBtn.classList.add('error');
        submitBtn.textContent = 'Error - check server';
        submitted = false;
        submitBtn.disabled = false;
      }
    }

    submitBtn.addEventListener('click', doSubmit);

    document.addEventListener('keydown', e => {
      if (e.key === 'F10') { e.preventDefault(); doSubmit(); }
    });
  </script>
</body>
</html>

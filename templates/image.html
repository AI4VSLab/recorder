<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Page</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-family: Helvetica;
            background-color: white;
        }
        .fullscreen-image {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
        .button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        .navigate-button {
            border: 2px solid black;
            margin-top: 20px;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 10px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        .navigate-button:hover {
            background-color: #45a049;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <img src="{{ image_urls[j] }}" alt="Fullscreen Image" class="fullscreen-image" id="fullscreenImage">
    <div class="button-container">
        <button class="navigate-button" onclick="goNext()">Next</button>
    </div>

    <script>
        var patient_id = '{{ patient_id | safe }}';
        var image_number = '{{ j | safe }}';
        var pageLoadTime = new Date().toISOString();

        function goNext() {
            var nextButtonClickTime = new Date().toISOString();
            var data = {
                patient_id: patient_id,
                image_number: image_number,
                page_load_time: pageLoadTime,
                next_button_click_time: nextButtonClickTime
            };

            // Send data to the server
            $.ajax({
                url: '/log_time',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(response) {
                    // Navigate to the previous page after successful logging
                    window.location.href = 'http://localhost:5500/image/' + encodeURIComponent(patient_id);
                },
                error: function(error) {
                    console.error('Error logging time data:', error);
                    // Navigate to the previous page even if logging fails
                    window.location.href = 'http://localhost:5500/image/' + encodeURIComponent(patient_id);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    });
                } else if (elem.mozRequestFullScreen) { // Firefox
                    elem.mozRequestFullScreen().catch(err => {
                        console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    });
                } else if (elem.webkitRequestFullscreen) { // Chrome, Safari and Opera
                    elem.webkitRequestFullscreen().catch(err => {
                        console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    });
                } else if (elem.msRequestFullscreen) { // IE/Edge
                    elem.msRequestFullscreen().catch(err => {
                        console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    });
                }
            }
        });
    </script>
</body>
</html>
